# /etc/mosquitto/conf.d/har.conf
# Nghe trên mọi giao diện nhưng bắt buộc user/mật khẩu; tường lửa (setup-pi.sh) chỉ mở 1883
# cho mạng hotspot. Tạo user: sudo mosquitto_passwd -c /etc/mosquitto/passwd har01
per_listener_settings true
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
max_inflight_messages 40
max_queued_messages 2000
persistence true
