[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "har-edge"
version = "1.0.0"
description = "Dịch vụ edge trên Raspberry Pi 4 cho bộ đeo HAR"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["har_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
