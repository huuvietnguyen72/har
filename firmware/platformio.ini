; Firmware bộ đeo HAR — mở THƯ MỤC firmware/ trong VS Code + PlatformIO.
;   pio run -e esp32dev -t upload && pio device monitor
;   pio test -e native          (test bộ phát hiện té và nút trên máy tính, cần gcc)

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1
    adafruit/Adafruit BMP280 Library@^2.6.8
    olikraus/U8g2@^2.36.2

[env:native]
platform = native
build_flags = -std=c++17
test_build_src = no
lib_compat_mode = off
lib_ignore = PubSubClient, ArduinoJson, Adafruit BMP280 Library, U8g2
