[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    adafruit/Adafruit MPU6050
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit AHTX0
    olikraus/U8g2
