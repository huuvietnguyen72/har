<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" width="1320" height="760" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">
  <title>Cấu trúc hộp đeo HAR01</title>
  <desc>Hộp in 3D 95 × 60 × 40 mm, hai tầng: tầng trên OLED, 2 LED, nút; tầng dưới PCB chính (ESP32, MPU6050, AHT20+BMP280), TP4056, MT3608, loa, pin LiPo 803040 cạnh mạch gần cổng sạc; cổng sạc và công tắc ở thành hộp; kẹp thắt lưng, đeo hông phải.</desc>
  <rect width="1320" height="760" fill="#ffffff"/>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#111">Cấu trúc hộp đeo HAR01</text>
  <text x="40" y="68" fill="#555">Hộp in 3D 95 × 60 × 40 mm (kích thước hộp đúng tỉ lệ 3 px/mm ở hình 1–2, 4 px/mm ở hình 3). Vị trí linh kiện bên trong là tương đối.</text>

  <!-- ============ HÌNH 1: MẶT TRÊN ============ -->
  <text x="80" y="112" font-size="15" font-weight="700" fill="#111">1. Mặt trên (hướng ra ngoài khi đeo)</text>
  <rect x="80" y="130" width="285" height="180" rx="14" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
  <!-- OLED -->
  <rect x="108" y="168" width="96" height="64" rx="3" fill="#263238" stroke="#111"/>
  <rect x="114" y="176" width="84" height="44" fill="#0d47a1"/>
  <text x="156" y="196" font-size="11" fill="#e3f2fd" text-anchor="middle">STAND 97%</text>
  <text x="156" y="212" font-size="10" fill="#90caf9" text-anchor="middle">online · 11:25</text>
  <!-- LED -->
  <circle cx="262" cy="182" r="8" fill="#43a047" stroke="#1b5e20" stroke-width="1.5"/>
  <circle cx="296" cy="182" r="8" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
  <!-- nút 12 × 12 mm -->
  <rect x="261" y="226" width="36" height="36" rx="4" fill="#cfd8dc" stroke="#37474f" stroke-width="1.5"/>
  <circle cx="279" cy="244" r="11" fill="#455a64"/>
  <!-- số chú thích -->
  <g font-size="11" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="156" cy="252" r="10" fill="#6a1b9a"/><text x="156" y="256">1</text>
    <circle cx="262" cy="158" r="10" fill="#6a1b9a"/><text x="262" y="162">2</text>
    <circle cx="296" cy="158" r="10" fill="#6a1b9a"/><text x="296" y="162">3</text>
    <circle cx="320" cy="282" r="10" fill="#6a1b9a"/><text x="320" y="286">4</text>
  </g>
  <!-- kích thước -->
  <g stroke="#555" stroke-width="1">
    <path d="M80 326 H365 M80 320 V332 M365 320 V332"/>
    <path d="M62 130 V310 M56 130 H68 M56 310 H68"/>
  </g>
  <text x="222" y="344" text-anchor="middle" fill="#333">95 mm</text>
  <text x="50" y="224" text-anchor="middle" fill="#333" transform="rotate(-90 50 224)">60 mm</text>
  <g font-size="12" fill="#222">
    <text x="80" y="372"><tspan font-weight="700" fill="#6a1b9a">1</tspan>  OLED 0,96" (128 × 64): hoạt động, %, giờ, cảnh báo</text>
    <text x="80" y="392"><tspan font-weight="700" fill="#6a1b9a">2</tspan>  LED xanh: sáng = đã nối MQTT, nháy chậm = đang nối</text>
    <text x="80" y="412"><tspan font-weight="700" fill="#6a1b9a">3</tspan>  LED đỏ: nháy = cảnh báo, sáng = lỗi cảm biến</text>
    <text x="80" y="432"><tspan font-weight="700" fill="#6a1b9a">4</tspan>  Nút 12 × 12 mm: 1 lần bật màn · 2 lần đánh dấu</text>
    <text x="96" y="450">· 3 lần hiệu chỉnh · giữ 3 s SOS · đang báo động: nhấn = hủy</text>
  </g>

  <!-- ============ HÌNH 2: TẦNG DƯỚI ============ -->
  <text x="500" y="112" font-size="15" font-weight="700" fill="#111">2. Tầng dưới (bỏ nắp và tầng trên)</text>
  <rect x="500" y="130" width="285" height="180" rx="14" fill="#fafafa" stroke="#37474f" stroke-width="2"/>
  <!-- vùng mạch -->
  <rect x="512" y="142" width="170" height="156" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="522" y="162" font-weight="700" fill="#1b5e20">Mạch</text>
  <g font-size="12" fill="#222">
    <text x="522" y="182">PCB chính:</text>
    <text x="530" y="199">· ESP32 DevKit</text>
    <text x="530" y="216">· MPU6050 (hàn trên PCB)</text>
    <text x="530" y="233">· AHT20 + BMP280</text>
    <text x="522" y="254">TP4056 (sạc)</text>
    <text x="522" y="271">MT3608 (tăng áp 5 V)</text>
    <text x="522" y="288">Loa + transistor</text>
  </g>
  <!-- pin 803040: 30 × 40 mm -->
  <rect x="690" y="150" width="84" height="120" rx="6" fill="#fff8e1" stroke="#8d6e00" stroke-width="1.5"/>
  <text x="732" y="196" text-anchor="middle" font-weight="700" fill="#5d4037">Pin LiPo</text>
  <text x="732" y="214" text-anchor="middle" font-size="12" fill="#5d4037">803040</text>
  <text x="732" y="231" text-anchor="middle" font-size="12" fill="#5d4037">3,7 V</text>
  <text x="732" y="248" text-anchor="middle" font-size="12" fill="#5d4037">1000 mAh</text>
  <!-- cổng trên thành hộp -->
  <rect x="779" y="158" width="12" height="26" fill="#212121"/>
  <rect x="779" y="276" width="12" height="20" fill="#f57c00"/>
  <path d="M791 171 H822" stroke="#555"/><text x="826" y="168" font-size="12" fill="#222">Cổng sạc USB</text>
  <text x="826" y="184" font-size="12" fill="#666">(TP4056)</text>
  <path d="M791 286 H822" stroke="#555"/><text x="826" y="290" font-size="12" fill="#222">Công tắc</text>
  <text x="500" y="340" font-size="12" fill="#444">Pin đặt cạnh mạch, sát thành hộp có cổng sạc.</text>
  <text x="500" y="358" font-size="12" fill="#444">Cổng sạc và công tắc nằm trên thành hộp.</text>

  <!-- ============ HÌNH 4: KHI ĐEO ============ -->
  <text x="1000" y="112" font-size="15" font-weight="700" fill="#111">4. Khi đeo (nhìn từ trước)</text>
  <g fill="#cfd8dc" stroke="#607d8b" stroke-width="1.5">
    <circle cx="1130" cy="152" r="22"/>
    <rect x="1098" y="178" width="64" height="104" rx="10"/>
    <rect x="1100" y="286" width="26" height="112" rx="8"/>
    <rect x="1134" y="286" width="26" height="112" rx="8"/>
    <rect x="1076" y="182" width="18" height="92" rx="8"/>
    <rect x="1166" y="182" width="18" height="92" rx="8"/>
  </g>
  <rect x="1096" y="270" width="68" height="10" fill="#5d4037"/>
  <!-- hộp ở hông phải người đeo = bên trái hình -->
  <rect x="1082" y="262" width="22" height="34" rx="3" fill="#ff8f00" stroke="#e65100" stroke-width="1.5"/>
  <path d="M1060 268 V318" stroke="#c62828" stroke-width="2.5"/>
  <path d="M1054 310 L1060 322 L1066 310 Z" fill="#c62828"/>
  <text x="1040" y="300" font-weight="700" fill="#c62828">X</text>
  <g font-size="12" fill="#222">
    <text x="1000" y="424">Hông phải, kẹp vào thắt lưng.</text>
    <text x="1000" y="442">Nhìn từ trước nên hộp ở bên trái hình.</text>
    <text x="1000" y="460" fill="#c62828" font-weight="700">Đứng thẳng: trục X MPU6050 chỉ xuống</text>
    <text x="1000" y="478" fill="#c62828" font-weight="700">đất (ax ≈ −1 g).</text>
  </g>

  <!-- ============ HÌNH 3: MẶT CẮT ============ -->
  <text x="80" y="512" font-size="15" font-weight="700" fill="#111">3. Mặt cắt dọc: hai tầng</text>
  <!-- vỏ: 95 × 40 mm, 4 px/mm -->
  <rect x="300" y="540" width="380" height="160" rx="10" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
  <rect x="308" y="548" width="364" height="144" rx="6" fill="#ffffff" stroke="#90a4ae"/>
  <!-- tầng trên -->
  <rect x="316" y="562" width="300" height="6" fill="#a5d6a7" stroke="#2e7d32"/>
  <rect x="330" y="536" width="96" height="26" fill="#263238"/>           <!-- OLED lộ qua mặt trên -->
  <circle cx="470" cy="548" r="7" fill="#43a047"/><circle cx="500" cy="548" r="7" fill="#e53935"/>
  <rect x="540" y="530" width="40" height="32" rx="4" fill="#455a64"/>    <!-- nút nhô lên -->
  <!-- dây nối giữa hai tầng -->
  <path d="M360 568 C 360 600, 380 610, 380 640" stroke="#7b1fa2" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
  <path d="M560 568 C 560 600, 520 610, 520 640" stroke="#2e7d32" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
  <!-- tầng dưới: PCB + ESP32 -->
  <rect x="316" y="660" width="220" height="8" fill="#a5d6a7" stroke="#2e7d32"/>
  <rect x="330" y="640" width="160" height="20" rx="2" fill="#3949ab"/>
  <text x="410" y="655" font-size="11" fill="#fff" text-anchor="middle">ESP32 DevKit</text>
  <rect x="496" y="648" width="34" height="12" fill="#1565c0"/>
  <text x="513" y="644" font-size="10" fill="#1565c0" text-anchor="middle">MPU</text>
  <rect x="320" y="668" width="210" height="16" fill="#f5f5f5" stroke="#9e9e9e" stroke-dasharray="3 2"/>
  <text x="425" y="680" font-size="10" fill="#555" text-anchor="middle">cùng tầng: TP4056 · MT3608 · loa · AHT20+BMP280</text>
  <!-- pin -->
  <rect x="548" y="652" width="120" height="32" rx="5" fill="#fff8e1" stroke="#8d6e00" stroke-width="1.5"/>
  <text x="608" y="672" font-size="11" fill="#5d4037" text-anchor="middle">Pin 803040 · dày 8 mm</text>
  <!-- cổng sạc, công tắc trên thành -->
  <rect x="672" y="660" width="10" height="18" fill="#212121"/>
  <rect x="672" y="610" width="10" height="16" fill="#f57c00"/>
  <!-- kẹp thắt lưng ở mặt sau -->
  <path d="M360 700 V716 H600 V706" fill="none" stroke="#5d4037" stroke-width="5" stroke-linejoin="round"/>
  <!-- kích thước -->
  <g stroke="#555" stroke-width="1">
    <path d="M300 732 H680 M300 726 V738 M680 726 V738"/>
    <path d="M282 540 V700 M276 540 H288 M276 700 H288"/>
  </g>
  <text x="490" y="750" text-anchor="middle" fill="#333">95 mm</text>
  <text x="270" y="620" text-anchor="middle" fill="#333" transform="rotate(-90 270 620)">40 mm</text>
  <!-- chú thích bên trái -->
  <g font-size="12" fill="#222">
    <path d="M330 549 H250" stroke="#999"/><text x="80" y="546">Mặt trên (ra ngoài)</text>
    <text x="80" y="562" fill="#555">OLED, 2 LED, nút</text>
    <path d="M316 565 H250" stroke="#999"/><text x="80" y="590">Tầng trên: OLED, LED,</text>
    <text x="80" y="606" fill="#555">nút, gắn dưới mặt trên</text>
    <path d="M316 664 H250" stroke="#999"/><text x="80" y="658">Tầng dưới: PCB chính</text>
    <text x="80" y="674" fill="#555">ESP32 + MPU6050 hàn cố định</text>
    <path d="M360 716 H250" stroke="#999"/><text x="80" y="716">Mặt sau áp vào người:</text>
    <text x="80" y="732" fill="#555">kẹp thắt lưng</text>
  </g>
  <!-- chú thích bên phải -->
  <g font-size="12" fill="#222">
    <path d="M682 618 H720" stroke="#999"/><text x="726" y="622">Công tắc (thành hộp)</text>
    <path d="M682 669 H720" stroke="#999"/><text x="726" y="673">Cổng sạc USB (thành hộp)</text>
    <path d="M370 600 H330" stroke="none"/>
    <text x="726" y="560" fill="#7b1fa2">- - dây I2C của OLED</text>
    <text x="726" y="578" fill="#2e7d32">- - dây nút và 2 LED</text>
  </g>

  <!-- ============ GHI CHÚ ============ -->
  <rect x="930" y="520" width="350" height="210" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="946" y="546" font-weight="700" fill="#111">Lưu ý khi lắp và đeo</text>
  <g font-size="12" fill="#333">
    <text x="946" y="570">· MPU6050 hàn cố định trên PCB chính, nên hướng</text>
    <text x="956" y="587">trục gắn liền với hộp; hộp xoay là trục xoay.</text>
    <text x="946" y="610">· Kẹp chặt vào thắt lưng để hộp không lắc, không</text>
    <text x="956" y="627">lật khi đi, ngồi, cúi.</text>
    <text x="946" y="650">· Đổi người đeo hoặc cách kẹp: nhấn nút 3 lần rồi</text>
    <text x="956" y="667">đứng thẳng yên (hoặc /hieuchinh trên Telegram).</text>
    <text x="946" y="690">· Pin không có đo áp: sạc đầy trước khi dùng; tắt</text>
    <text x="956" y="707">bằng công tắc khi không đeo.</text>
  </g>
</svg>
