<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 860" width="1320" height="860" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">
  <title>Sơ đồ lắp mạch bộ đeo HAR01</title>
  <desc>ESP32 DevKit, khối nguồn LiPo 803040 → TP4056 → công tắc → MT3608 → VIN; một bus I2C GPIO21/22 nối MPU6050, AHT20+BMP280, OLED; nút GPIO19, LED GPIO26/27, loa GPIO25 qua transistor.</desc>
  <defs>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4"/></marker>
  </defs>
  <rect width="1320" height="860" fill="#ffffff"/>

  <!-- tiêu đề -->
  <text x="40" y="44" font-size="22" font-weight="700" fill="#111">Sơ đồ lắp mạch bộ đeo HAR01</text>
  <text x="40" y="68" fill="#555">Theo mạch đang hàn (đo trên thiết bị 17/11/2026 + xác nhận của người làm mạch). Sơ đồ nguyên lý, không phải ảnh chụp.</text>

  <!-- ================= KHỐI NGUỒN (trái) ================= -->
  <text x="40" y="104" font-size="15" font-weight="700" fill="#111">1. Nguồn</text>
  <!-- pin -->
  <rect x="40" y="118" width="210" height="78" rx="8" fill="#fff8e1" stroke="#8d6e00" stroke-width="1.5"/>
  <text x="56" y="142" font-weight="700" fill="#111">Pin LiPo 3,7 V · 1000 mAh</text>
  <text x="56" y="161" fill="#444">mã 803040 (8 × 30 × 40 mm)</text>
  <text x="56" y="180" fill="#444">nằm cạnh mạch, gần cổng sạc</text>
  <text x="96" y="214" fill="#d32f2f" font-weight="700">+</text>
  <text x="178" y="214" fill="#222" font-weight="700">−</text>
  <!-- TP4056 -->
  <rect x="40" y="250" width="210" height="96" rx="8" fill="#f5f5f5" stroke="#444" stroke-width="1.5"/>
  <text x="56" y="276" font-weight="700" fill="#111">TP4056 · sạc + bảo vệ pin</text>
  <text x="56" y="295" fill="#444">cổng USB sạc ở thành hộp</text>
  <text x="62" y="264" font-size="11" fill="#666">B+</text><text x="190" y="264" font-size="11" fill="#666">B−</text>
  <text x="58" y="338" font-size="11" fill="#666">OUT+</text><text x="184" y="338" font-size="11" fill="#666">OUT−</text>
  <!-- công tắc -->
  <text x="118" y="398" fill="#111" font-weight="700">Công tắc</text>
  <text x="118" y="414" font-size="11" fill="#666">(thành hộp)</text>
  <!-- MT3608 -->
  <rect x="40" y="470" width="210" height="150" rx="8" fill="#f5f5f5" stroke="#444" stroke-width="1.5"/>
  <text x="56" y="497" font-weight="700" fill="#111">MT3608 · tăng áp</text>
  <text x="56" y="516" fill="#444">3,0–4,2 V → 5,0 V</text>
  <text x="56" y="535" fill="#444">chỉnh 5,0 V trước khi nối</text>
  <text x="62" y="484" font-size="11" fill="#666">IN+</text><text x="194" y="484" font-size="11" fill="#666">IN−</text>
  <text x="198" y="575" font-size="11" fill="#666">OUT+</text><text x="198" y="615" font-size="11" fill="#666">OUT−</text>

  <!-- dây nguồn -->
  <g fill="none" stroke-width="2.5">
    <path d="M100 196 V250" stroke="#d32f2f"/>
    <path d="M180 196 V250" stroke="#222"/>
    <path d="M100 346 V382" stroke="#d32f2f"/>
    <path d="M100 382 L88 410" stroke="#d32f2f"/>        <!-- lưỡi công tắc -->
    <path d="M100 418 V470" stroke="#d32f2f"/>
    <path d="M180 346 V470" stroke="#222"/>
    <path d="M250 570 H400" stroke="#d32f2f"/>             <!-- 5 V -> VIN -->
    <path d="M250 610 H400" stroke="#222"/>                <!-- GND -->
  </g>
  <circle cx="100" cy="382" r="3.5" fill="#d32f2f"/><circle cx="100" cy="418" r="3.5" fill="#d32f2f"/>
  <text x="262" y="562" font-size="12" fill="#d32f2f" font-weight="700">5,0 V</text>
  <text x="262" y="602" font-size="12" fill="#222" font-weight="700">GND</text>
  <text x="40" y="648" font-size="12" fill="#555">Hoặc cắm USB 5 V thẳng vào ESP32 (nạp firmware, chạy thử).</text>
  <text x="40" y="666" font-size="12" fill="#555">Không có cầu chia áp đo pin → firmware gửi battery_v: null.</text>

  <!-- ================= ESP32 (giữa) ================= -->
  <rect x="400" y="150" width="250" height="620" rx="10" fill="#e8eaf6" stroke="#283593" stroke-width="2"/>
  <text x="420" y="182" font-size="16" font-weight="700" fill="#1a237e">ESP32 DevKit</text>
  <text x="420" y="202" fill="#333">ESP32-D0WD-V3 · 240 MHz</text>
  <text x="420" y="220" fill="#333">4 MB flash · Wi-Fi 2,4 GHz</text>
  <!-- chân trái -->
  <text x="408" y="575" font-weight="700" fill="#d32f2f">VIN (5V)</text>
  <text x="408" y="615" font-weight="700" fill="#222">GND</text>
  <!-- chân phải -->
  <g text-anchor="end" font-weight="700">
    <text x="642" y="264" fill="#d32f2f">3V3</text>
    <text x="642" y="304" fill="#222">GND</text>
    <text x="642" y="344" fill="#1565c0">GPIO21 · SDA</text>
    <text x="642" y="384" fill="#7b1fa2">GPIO22 · SCL</text>
    <text x="642" y="474" fill="#2e7d32">GPIO19</text>
    <text x="642" y="534" fill="#2e7d32">GPIO26</text>
    <text x="642" y="594" fill="#2e7d32">GPIO27</text>
    <text x="642" y="684" fill="#2e7d32">GPIO25</text>
    <text x="642" y="744" fill="#888">GPIO34</text>
  </g>

  <!-- ================= BUS I2C ================= -->
  <text x="690" y="104" font-size="15" font-weight="700" fill="#111">2. Bus I2C (400 kHz, một bus cho cả 3 module)</text>
  <g fill="none" stroke-width="2.5">
    <path d="M650 260 H720 V128" stroke="#d32f2f"/>
    <path d="M720 260 V436" stroke="#d32f2f"/>
    <path d="M650 300 H750 V128" stroke="#222"/>
    <path d="M750 300 V436" stroke="#222"/>
    <path d="M650 340 H780 V128" stroke="#1565c0"/>
    <path d="M780 340 V436" stroke="#1565c0"/>
    <path d="M650 380 H810 V128" stroke="#7b1fa2"/>
    <path d="M810 380 V436" stroke="#7b1fa2"/>
  </g>
  <text x="702" y="122" font-size="11" fill="#d32f2f">3V3</text>
  <text x="737" y="122" font-size="11" fill="#222">GND</text>
  <text x="767" y="122" font-size="11" fill="#1565c0">SDA</text>
  <text x="797" y="122" font-size="11" fill="#7b1fa2">SCL</text>

  <!-- module: hàng chân VCC, GND, SDA, SCL -->
  <!-- MPU6050 -->
  <rect x="860" y="128" width="330" height="92" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="930" y="152" font-weight="700" fill="#111">MPU6050 (GY-521) · 0x68</text>
  <text x="930" y="171" fill="#444">gia tốc ±8 g, con quay ±500 °/s</text>
  <text x="930" y="190" fill="#444">AD0 → GND · hàn trên PCB chính</text>
  <text x="930" y="209" fill="#c62828" font-weight="700">đứng thẳng: trục X chỉ xuống đất</text>
  <!-- AHT20 + BMP280 -->
  <rect x="860" y="236" width="330" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="930" y="260" font-weight="700" fill="#111">AHT20 + BMP280 · 0x38 + 0x77</text>
  <text x="930" y="279" fill="#444">1 board, 2 địa chỉ</text>
  <text x="930" y="298" fill="#444">áp suất (độ cao), nhiệt độ, độ ẩm</text>
  <!-- OLED -->
  <rect x="860" y="332" width="330" height="80" rx="8" fill="#fce4ec" stroke="#ad1457" stroke-width="1.5"/>
  <text x="930" y="356" font-weight="700" fill="#111">OLED 0,96" · 0x3C</text>
  <text x="930" y="375" fill="#444">128 × 64, U8g2 · mặt trên hộp</text>
  <text x="930" y="394" fill="#444">trạng thái, hoạt động, cảnh báo té</text>

  <!-- dây từ bus vào module -->
  <g fill="none" stroke-width="2">
    <!-- MPU6050 -->
    <path d="M720 146 H860" stroke="#d32f2f"/><path d="M750 164 H860" stroke="#222"/>
    <path d="M780 182 H860" stroke="#1565c0"/><path d="M810 200 H860" stroke="#7b1fa2"/>
    <!-- AHT20 + BMP280 -->
    <path d="M720 250 H860" stroke="#d32f2f"/><path d="M750 266 H860" stroke="#222"/>
    <path d="M780 282 H860" stroke="#1565c0"/><path d="M810 298 H860" stroke="#7b1fa2"/>
    <!-- OLED -->
    <path d="M720 346 H860" stroke="#d32f2f"/><path d="M750 362 H860" stroke="#222"/>
    <path d="M780 378 H860" stroke="#1565c0"/><path d="M810 394 H860" stroke="#7b1fa2"/>
  </g>
  <g>
    <circle cx="720" cy="146" r="4" fill="#d32f2f"/><circle cx="750" cy="164" r="4" fill="#222"/><circle cx="780" cy="182" r="4" fill="#1565c0"/><circle cx="810" cy="200" r="4" fill="#7b1fa2"/>
    <circle cx="720" cy="250" r="4" fill="#d32f2f"/><circle cx="750" cy="266" r="4" fill="#222"/><circle cx="780" cy="282" r="4" fill="#1565c0"/><circle cx="810" cy="298" r="4" fill="#7b1fa2"/>
    <circle cx="720" cy="346" r="4" fill="#d32f2f"/><circle cx="750" cy="362" r="4" fill="#222"/><circle cx="780" cy="378" r="4" fill="#1565c0"/><circle cx="810" cy="394" r="4" fill="#7b1fa2"/>
    <circle cx="720" cy="260" r="4" fill="#d32f2f"/><circle cx="750" cy="300" r="4" fill="#222"/><circle cx="780" cy="340" r="4" fill="#1565c0"/><circle cx="810" cy="380" r="4" fill="#7b1fa2"/>
  </g>
  <g font-size="10" fill="#666">
    <text x="866" y="149">VCC</text><text x="866" y="167">GND</text><text x="866" y="185">SDA</text><text x="866" y="203">SCL</text>
    <text x="866" y="253">VCC</text><text x="866" y="269">GND</text><text x="866" y="285">SDA</text><text x="866" y="301">SCL</text>
    <text x="866" y="349">VCC</text><text x="866" y="365">GND</text><text x="866" y="381">SDA</text><text x="866" y="397">SCL</text>
  </g>

  <!-- ================= NGOẠI VI ================= -->
  <text x="690" y="456" font-size="15" font-weight="700" fill="#111">3. Nút, đèn, loa</text>
  <g fill="none" stroke-width="2.5" stroke="#2e7d32">
    <path d="M650 470 H900"/><path d="M900 470 L930 456"/><path d="M934 470 H990"/>
    <path d="M650 530 H860"/><path d="M900 530 H940"/><path d="M962 530 H1010"/>
    <path d="M650 590 H860"/><path d="M900 590 H940"/><path d="M962 590 H1010"/>
    <path d="M650 680 H860"/><path d="M900 680 H1078"/>
  </g>
  <!-- nút -->
  <circle cx="900" cy="470" r="3.5" fill="#2e7d32"/><circle cx="934" cy="470" r="3.5" fill="#2e7d32"/>
  <text x="760" y="494" font-size="12" fill="#111">nút 12 × 12 mm (mặt trên hộp)</text>
  <text x="1030" y="466" font-size="12" fill="#444">INPUT_PULLUP, nhấn = LOW</text>
  <!-- điện trở (nét đứt = chưa đo) -->
  <g fill="#ffffff" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3">
    <rect x="860" y="522" width="40" height="16"/><rect x="860" y="582" width="40" height="16"/><rect x="860" y="672" width="40" height="16"/>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle"><text x="880" y="515">R</text><text x="880" y="575">R</text><text x="880" y="665">R</text></g>
  <!-- LED -->
  <path d="M940 520 L962 530 L940 540 Z" fill="#43a047" stroke="#1b5e20" stroke-width="1.5"/>
  <path d="M962 520 V540" stroke="#1b5e20" stroke-width="2"/>
  <path d="M940 580 L962 590 L940 600 Z" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
  <path d="M962 580 V600" stroke="#b71c1c" stroke-width="2"/>
  <text x="1036" y="526" font-size="12" fill="#111">LED xanh (mặt trên): sáng = đã nối MQTT</text>
  <text x="1036" y="542" font-size="12" fill="#444">nháy chậm = đang nối</text>
  <text x="1036" y="586" font-size="12" fill="#111">LED đỏ (mặt trên): nháy = cảnh báo</text>
  <text x="1036" y="602" font-size="12" fill="#444">sáng = lỗi cảm biến</text>
  <!-- transistor NPN + loa -->
  <circle cx="1100" cy="680" r="22" fill="#ffffff" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M1088 666 V694" stroke="#333" stroke-width="2.5"/>
  <path d="M1078 680 H1088" stroke="#2e7d32" stroke-width="2.5"/>
  <path d="M1088 672 L1112 660 V650" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M1088 688 L1112 700 V728" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="1094" y="618" width="36" height="32" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="1112" y="639" font-size="11" text-anchor="middle" fill="#e65100">LOA</text>
  <path d="M1130 634 H1158" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1164" y="638" font-size="11" fill="#d32f2f">+V (chưa đối chiếu)</text>
  <text x="1134" y="676" font-size="12" fill="#111">NPN (mã chưa đối chiếu)</text>
  <text x="1134" y="692" font-size="12" fill="#444">GPIO25 HIGH = loa kêu</text>
  <text x="1134" y="708" font-size="12" fill="#444">(đo thấy B–E xuống GND)</text>
  <!-- ký hiệu GND -->
  <g stroke="#222" stroke-width="2">
    <path d="M990 470 V484"/><path d="M980 484 H1000 M984 489 H996 M988 494 H992"/>
    <path d="M1010 530 V544"/><path d="M1000 544 H1020 M1004 549 H1016 M1008 554 H1012"/>
    <path d="M1010 590 V604"/><path d="M1000 604 H1020 M1004 609 H1016 M1008 614 H1012"/>
    <path d="M1112 728 V736"/><path d="M1102 736 H1122 M1106 741 H1118 M1110 746 H1114"/>
  </g>
  <!-- GPIO34 không nối -->
  <path d="M650 740 H690" stroke="#999" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M686 734 L698 746 M698 734 L686 746" stroke="#999" stroke-width="2"/>
  <text x="706" y="745" font-size="12" fill="#777">không nối (không đo áp pin)</text>

  <!-- ================= CHÚ THÍCH ================= -->
  <g font-size="12">
    <rect x="40" y="700" width="330" height="120" rx="8" fill="#fafafa" stroke="#ddd"/>
    <text x="56" y="724" font-weight="700" fill="#111">Chú thích</text>
    <path d="M56 744 H96" stroke="#d32f2f" stroke-width="3"/><text x="104" y="748" fill="#333">nguồn (pin, 5 V, 3V3)</text>
    <path d="M220 744 H260" stroke="#222" stroke-width="3"/><text x="268" y="748" fill="#333">GND chung</text>
    <path d="M56 768 H96" stroke="#1565c0" stroke-width="3"/><text x="104" y="772" fill="#333">SDA</text>
    <path d="M140 768 H180" stroke="#7b1fa2" stroke-width="3"/><text x="188" y="772" fill="#333">SCL</text>
    <path d="M220 768 H260" stroke="#2e7d32" stroke-width="3"/><text x="268" y="772" fill="#333">tín hiệu GPIO</text>
    <rect x="56" y="784" width="40" height="14" fill="none" stroke="#555" stroke-dasharray="4 3"/><text x="104" y="796" fill="#333">nét đứt: giá trị / mã linh kiện chưa đối chiếu</text>
    <circle cx="76" cy="810" r="4" fill="#222"/><text x="104" y="814" fill="#333">chấm: điểm nối; dây cắt nhau không chấm = không nối</text>
  </g>
</svg>
