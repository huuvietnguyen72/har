# HAR cloud trên Cloudflare: một Worker = API /api/* (D1) + web app (file tĩnh của webapp/dist).
# Hướng dẫn deploy: cloud/README.md
name = "har-cloud"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "../webapp/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"   # /history, /alerts... trả index.html cho React Router
run_worker_first = ["/api/*", "/ws", "/__scheduled"]  # chỉ API qua Worker (/__scheduled: gọi tay Cron khi wrangler dev --test-scheduled)

[[d1_databases]]
binding = "DB"
database_name = "har-db"
database_id = "3ac47a32-f869-4b54-a825-ef2d1cb9b815"  # npx wrangler d1 create har-db --location apac
migrations_dir = "migrations"

[vars]
JWT_EXPIRE_HOURS = "12"
STATUS_STALE_S = "30"        # trạng thái cũ hơn số giây này -> coi như offline
STATUS_LOG_EVERY_S = "60"    # lịch sử pin/nhiệt độ: tối đa 1 dòng mỗi 60 s
TZ_OFFSET_MIN = "420"        # giờ Việt Nam (UTC+7) để chia "ngày" cho trang Lịch sử
PI_OFFLINE_MIN = "10"        # Pi không gọi cloud quá 10 phút -> Telegram "Pi mất kết nối"
# Bí mật (npx wrangler secret put ...; chạy local: cloud/.dev.vars): JWT_SECRET, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

[triggers]
crons = ["*/5 * * * *"]      # kiểm tra Pi mất kết nối mỗi 5 phút (checkPiOffline)

[observability]
enabled = true
